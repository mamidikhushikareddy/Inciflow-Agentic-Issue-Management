[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "inciflow"
version = "0.1.0"
description = "Evidence-grounded agentic GitHub issue management"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.11,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.15,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"